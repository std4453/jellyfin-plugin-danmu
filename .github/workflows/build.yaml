name: "🏗️ Build Plugin"

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-dotnet@v3
        id: dotnet
        with:
          dotnet-version: 9.0.x
      - name: Change default dotnet version
        run: |
          echo '{"sdk":{"version": "${{ steps.dotnet.outputs.dotnet-version }}"}}' > ./global.json
      - name: Install dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build -c Release --no-restore
      - name: Offline regression tests
        run: dotnet test --no-restore --filter 'FullyQualifiedName~DandanTransportTests|FullyQualifiedName~DanmuDownloadCacheTests|FullyQualifiedName~PlaybackCacheTests|FullyQualifiedName~DanmuProviderIdTest|FullyQualifiedName~SaveItemsCompatTest|FullyQualifiedName~WriteFileIfChangedTest'
      - name: Package plugin
        run: |
          mkdir -p artifacts
          cp Jellyfin.Plugin.Danmu/bin/Release/net9.0/Jellyfin.Plugin.Danmu.dll LICENSE artifacts/
          sha256sum artifacts/Jellyfin.Plugin.Danmu.dll > artifacts/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: danmu-${{ github.sha }}
          path: artifacts/
